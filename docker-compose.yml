services:
  postgres:
    image: postgres:16-alpine
    container_name: tekprovider-postgres
    environment:
      POSTGRES_USER: tekprovider
      POSTGRES_PASSWORD: tekprovider
      POSTGRES_DB: tekprovider
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekprovider -d tekprovider"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: tekprovider-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
