name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: BackEnd
        run: dotnet restore TekProvider.slnx

      - name: Build
        working-directory: BackEnd
        run: dotnet build TekProvider.slnx --no-restore --configuration Release

      - name: Test
        working-directory: BackEnd
        run: dotnet test TekProvider.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/tekprovider-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/tekprovider-ui
        run: npm ci

      - name: Lint
        working-directory: frontend/tekprovider-ui
        run: npm run lint

      - name: Build
        working-directory: frontend/tekprovider-ui
        run: npm run build
